<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anu's Diary - Login</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
        <div class="login-card">
            <h1>Anu's Diary</h1>
            <p>Login or Register to continue</p>

            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" type="text" placeholder="Username" />
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Password" />
            </div>
            <div class="form-group">
                <label for="email">Email (optional for register)</label>
                <input id="email" type="email" placeholder="Email" />
            </div>
            <div class="form-group">
                <label for="phone">Phone (optional for register)</label>
                <input id="phone" type="tel" placeholder="Phone" />
            </div>
            <div class="form-group remember">
                <label><input id="remember-me" type="checkbox" /> Remember Me</label>
            </div>

            <div id="error-message" class="error-message"></div>

            <div class="btn-group">
                <button id="login-btn" class="btn">Login</button>
                <button id="register-btn" class="btn btn-secondary">Register</button>
            </div>
            <button id="forgot-btn" class="btn link-btn">Forgot Password</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
